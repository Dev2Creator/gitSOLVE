[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gitsolve"
version = "0.1.0"
description = "Underground GitHub Radar & Deep X-Ray Code Scanner for 2-5 Star Masterpieces"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
authors = [
    { name = "Dev2Creator" }
]
dependencies = [
    "rich>=13.0.0",
    "typer>=0.9.0",
    "questionary>=2.0.0",
    "requests>=2.28.0",
    "pyperclip>=1.8.0",
]

[project.scripts]
gs = "gitsolve.cli:main"
gitsolve = "gitsolve.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["gitsolve"]
